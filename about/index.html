<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Hawthorne Digital creates professional, affordable websites and digital solutions for businesses across the UK.">
<title>Hawthorne Digital | Websites That Work</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
    --navy: #202B4C;
    --blue: #2856B1;
    --blue-light: #EDF3FF;
    --text: #26324A;
    --muted: #718096;
    --border: #E6EAF1;
    --white: #FFFFFF;
    --background: #F8FAFD;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    scroll-behavior: smooth;
}

body {
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    background: var(--white);
    line-height: 1.65;
    padding-top: 112px;
}

a {
    text-decoration: none;
    color: inherit;
}

button, input, select, textarea {
    font: inherit;
}

.container {
    width: min(1160px, 90%);
    margin: auto;
}

/* TOP BAR */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 32px;
    background: var(--navy);
    color: white;
    z-index: 10002;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    letter-spacing: .5px;
}

.topbar a {
    color: white;
    font-weight: 700;
}

/* Keep the promotional bar on one line on small screens */
.topbar {
    white-space: nowrap;
    padding: 0 10px;
    gap: 4px;
    text-align: center;
}

.topbar a {
    white-space: nowrap;
}

/* HEADER */

header {
    position: fixed;
    top: 32px;
    left: 0;
    width: 100%;
    height: 80px;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    z-index: 10001;
    transition: box-shadow .25s ease;
}

header.scrolled {
    box-shadow: 0 8px 30px rgba(25,40,75,.09);
}

.nav-inner {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 205px;
    max-width: 100%;
    height: 55px;
    object-fit: contain;
    object-position: left center;
}

.logo-fallback {
    font-size: 21px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: -.8px;
}

.logo-fallback span {
    color: var(--blue);
}

nav {
    display: flex;
    align-items: center;
    gap: 29px;
}

nav a {
    font-size: 13px;
    font-weight: 600;
    color: #4D5870;
    transition: color .2s;
}

nav a:hover {
    color: var(--blue);
}

.nav-cta {
    background: var(--blue);
    color: white !important;
    padding: 12px 19px;
    border-radius: 7px;
    transition: .2s;
}

.nav-cta:hover {
    background: var(--navy);
    transform: translateY(-2px);
}

.menu-toggle {
    display: none;
    border: 0;
    background: none;
    color: var(--navy);
    font-size: 26px;
    cursor: pointer;
}

/* GENERAL */

section {
    padding: 100px 0;
    scroll-margin-top: 125px;
}

.eyebrow {
    color: var(--blue);
    text-transform: uppercase;
    letter-spacing: 2px;
    font-size: 11px;
    font-weight: 800;
    margin-bottom: 15px;
}

.section-heading {
    font-size: clamp(30px, 4vw, 43px);
    line-height: 1.2;
    color: var(--navy);
    letter-spacing: -1.5px;
    font-weight: 800;
}

.section-intro {
    max-width: 630px;
    margin-top: 17px;
    color: var(--muted);
    font-size: 15px;
}

.button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 15px 23px;
    background: var(--blue);
    color: white;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 700;
    border: 1px solid var(--blue);
    transition: .25s;
    cursor: pointer;
}

.button:hover {
    background: var(--navy);
    border-color: var(--navy);
    transform: translateY(-3px);
}

.button-outline {
    background: white;
    color: var(--navy);
    border-color: var(--border);
}

.button-outline:hover {
    color: white;
}

/* HERO */

.hero {
    padding: 105px 0 100px;
    background:
        radial-gradient(circle at 85% 20%, rgba(40,86,177,.09), transparent 28%),
        linear-gradient(180deg, #FFFFFF 0%, #F8FAFE 100%);
    overflow: hidden;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    align-items: center;
    gap: 65px;
}

.hero h1 {
    color: var(--navy);
    font-size: clamp(43px, 5.5vw, 67px);
    line-height: 1.08;
    letter-spacing: -3px;
    font-weight: 800;
    max-width: 650px;
}

.hero h1 span {
    color: var(--blue);
}

.hero-copy {
    color: var(--muted);
    font-size: 16px;
    max-width: 510px;
    margin: 25px 0 30px;
}

.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
}

.hero-note {
    margin-top: 26px;
    font-size: 12px;
    color: var(--muted);
}

.hero-visual {
    position: relative;
    min-height: 410px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.visual-glow {
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(40,86,177,.17), transparent 70%);
    border-radius: 50%;
}

.browser {
    position: relative;
    width: 100%;
    max-width: 470px;
    background: white;
    border: 1px solid #E3E9F3;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 35px 80px rgba(32,43,76,.14);
    transform: rotate(-2deg);
}

.browser-top {
    height: 39px;
    background: #F5F7FB;
    border-bottom: 1px solid #E8ECF3;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 6px;
}

.browser-dot {
    width: 7px;
    height: 7px;
    background: #C7D0DF;
    border-radius: 50%;
}

.browser-content {
    padding: 27px;
}

.browser-label {
    color: var(--blue);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
}

.browser-title {
    color: var(--navy);
    font-size: 27px;
    font-weight: 800;
